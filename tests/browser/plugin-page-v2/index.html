<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fixture runs</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #1f1f1f; background: #fff; }
      main { max-width: 44rem; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 8px; }
      .muted { color: #666; font-size: 12px; }
      .actions { display: flex; gap: 8px; margin: 16px 0; }
      button { min-height: 30px; padding: 0 12px; font: inherit; }
      pre { margin: 0; padding: 8px; font: 13px/1.5 ui-monospace, monospace; background: #f5f5f5; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Fixture runs</h1>
      <p id="detail" class="muted">Waiting for Prompting Time to open a run.</p>
      <p id="route" class="muted">Route: none yet</p>
      <p id="summary"></p>
      <div class="actions">
        <button id="refresh" type="button">Read status</button>
        <button id="rerun" type="button">Rerun this run</button>
        <button id="delete" type="button">Delete this run</button>
        <button id="undeclared" type="button">Call an undeclared action</button>
      </div>
      <p id="changed" class="muted">No files changed yet.</p>
      <pre id="log" aria-label="Messages"></pre>
    </main>
    <script src="page.js"></script>
  </body>
</html>
